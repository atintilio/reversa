# Rode os comandos "docker compose" de dentro da pasta deploy/.
# O arquivo .env (com os segredos) fica nesta mesma pasta e NAO vai para o Git.
name: reversa

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ./.env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      GOV_HOST: ${GOV_HOST:-reversa-gov.argusprime.com.br}
    # Sem "ports": o app so e acessivel pelo Caddy, pela rede interna.
    expose:
      - "3000"
    networks:
      - interna
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: reversa
      POSTGRES_DB: reversa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sem "ports": o banco nunca e exposto fora da rede interna.
    networks:
      - interna
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reversa -d reversa"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2
    environment:
      REVERSA_HOST: ${REVERSA_HOST:-reversa.argusprime.com.br}
      GOV_HOST: ${GOV_HOST:-reversa-gov.argusprime.com.br}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - interna
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 60s
      timeout: 10s
      retries: 3

networks:
  interna:

volumes:
  pgdata:
  caddy_data:
  caddy_config:

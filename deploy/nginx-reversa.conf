# Copiar para /etc/nginx/conf.d/reversa.conf. Mesmo padrao das outras solucoes (escuta em IPv6, porta 80, Cloudflare na frente).
# O Cloudflare envia o IP real em CF-Connecting-IP; repassamos como X-Forwarded-For para o limite de login funcionar.
server {
    listen [::]:80;
    server_name reversa.argusprime.com.br reversa-gov.argusprime.com.br reversa-teste.argusprime.com.br;
    client_max_body_size 100m;
    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

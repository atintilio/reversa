# Catálogo de oportunidades — Argus Prime / Reversa Tax
# Gerado a partir de Argus_Prime_Base_de_Conhecimento_COMPLETA_v1.0(1).docx
# Este catálogo descreve oportunidades; não autoriza cálculo ou oferta sem regra, fonte e evidência validadas.
version: "1.0.0"
source_date: "2026-09-10"
implementation_status: "catalog_only_needs_rule_workshops"
policy:
  opportunity_is_not_credit: true
  potential_requires_validation: true
  approved_requires_human_review: true
  never_claim_credit_without_evidence: true
  formulas_must_be_versioned: true
  risk_gate_precedes_score: true
scoring:
  opportunity_score_formula: "financial_potential*0.40 + scalability*0.30 + eligibility*0.15 + legal_security*0.10 + execution*0.05"
  thesis_market_score_formula: "financial_potential*0.25 + scalability*0.25 + market_size*0.20 + legal_security*0.15 + automation*0.15"
  risk_gate:
    - condition: "legal_security < 40"
      action: manual_review
    - condition: "eligibility < 50"
      action: do_not_offer
    - condition: "financial_potential < 2"
      action: low_priority
    - condition: "legal_status == controversa"
      action: legal_review_required
eligibility_states: [eligible, probably_eligible, needs_validation, not_eligible]
lifecycle:
  positive: [discovered, screening, probably_eligible, document_validation, calculated, qualified, decision_maker, proposal, converted]
  exceptions: [not_eligible, rejected, duplicated, insufficient_data, legal_review]

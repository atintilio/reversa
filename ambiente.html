<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FDFAF6">
<title>Escolha a plataforma · Reversa</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/shell.css">
<style>
/* Escolha entre Reversa Tax e Reversa Gov. Identidade Argus Prime: papel quente, tinta escura, bronze só como acento, cantos retos. */
body.escolha-pg {
  --bg: #FDFAF6; --card: #FFFDFA; --ink: #1F1A14; --primary: #26211A; --secondary: #F2EDE3;
  --muted-fg: #6B6258; --bronze: #9C7D53; --bronze-ink: #7E6340; --line: #E3DDD3;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --serif: "DM Serif Display", Georgia, serif; --sans: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--sans); min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
}
/* esta tela é a porta de entrada: sem o menu lateral do Tax e sem a busca */
html.rv-menu body.escolha-pg { padding-left: 0; }
body.escolha-pg .rv-side, body.escolha-pg .rv-veu, body.escolha-pg .rv-top .abre, body.escolha-pg .rv-top form { display: none !important; }
body.escolha-pg .rv-top { background: var(--bg); border-bottom: 1px solid var(--line); backdrop-filter: none; -webkit-backdrop-filter: none; }
body.escolha-pg .rv-top::before { content: ""; width: 30px; height: 30px; background: url(/assets/reversa-r.png) left center / contain no-repeat; }
body.escolha-pg .rv-top .av { border-radius: 0; background: var(--primary); }
body.escolha-pg .rv-top .sair { border-radius: 0; border-color: var(--line); color: var(--primary); }
body.escolha-pg .rv-top .sair:hover { border-color: var(--bronze); }

.escolha-pg main { flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 72px 32px 64px; animation: none; }
.escolha-pg main > * { animation: none; }
.olho { display: flex; align-items: center; gap: 14px; font: 600 12px/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--bronze-ink); margin: 0 0 22px; }
.olho::before { content: ""; width: 32px; height: 1px; background: var(--bronze); }
.escolha-pg h1 { font: 400 clamp(2.4rem, 4.6vw, 3.6rem)/1.06 var(--serif); letter-spacing: -.01em; color: var(--ink); max-width: 28ch; margin: 0; text-wrap: balance; }
.escolha-pg h1 em { font-style: italic; color: var(--bronze); font-family: var(--serif); font-weight: 400; }
.escolha-pg .sub { color: var(--muted-fg); font-size: 16px; max-width: 56ch; margin: 18px 0 0; }

.escolha { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 56px; border: 1px solid var(--line); background: var(--card); }
.rv .escolha .amb { all: unset; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 0; padding: 44px 44px 0; cursor: pointer; color: var(--ink); font: inherit; text-align: left; transition: background-color .3s var(--ease); }
.rv .escolha .amb + .amb { border-left: 1px solid var(--line); }
/* círculo fino de contorno: motivo da marca Argus */
.rv .escolha .amb::before { content: ""; position: absolute; width: 360px; height: 360px; right: -170px; top: -170px; border: 1px solid rgba(156, 125, 83, .22); border-radius: 50%; transition: transform .5s var(--ease), border-color .3s var(--ease); pointer-events: none; }
.rv .escolha .amb:active { transform: none; }
.rv .escolha .amb:active .ir { transform: translateY(1px); }
.rv .escolha .amb:focus-visible { outline: 2px solid var(--bronze); outline-offset: -6px; }
.amb .publico { font: 600 12px/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--bronze-ink); }
.amb .nome { display: flex; align-items: center; gap: 14px; margin: 26px 0 16px; }
.amb .nome img { width: 44px; height: auto; flex: none; }
.amb .h2 { font: 400 clamp(2.2rem, 3.4vw, 2.9rem)/1 var(--serif); letter-spacing: -.01em; color: var(--ink); margin: 0; }
.amb .h2 em { font-style: italic; color: var(--bronze); }
.amb p { margin: 0; color: var(--muted-fg); font-size: 16px; max-width: 42ch; line-height: 1.6; }
.amb ul { list-style: none; margin: 28px 0 36px; padding: 0; border-top: 1px solid var(--line); }
.amb li { padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--primary); }
.amb .ir { margin: auto -44px 0; display: flex; justify-content: space-between; align-items: center; padding: 22px 44px; background: var(--primary); color: #FDFAF6; font: 600 13px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; transition: background-color .3s var(--ease); }
.amb .ir span { font-size: 18px; letter-spacing: 0; transition: transform .5s var(--ease); }

.assinatura { display: flex; align-items: center; gap: 20px; margin-top: 56px; padding-top: 28px; border-top: 1px solid var(--line); }
.assinatura img { width: 80px; height: auto; flex: none; }
.assinatura p { margin: 0; font-size: 14px; color: var(--muted-fg); }
.assinatura strong { display: block; font: 400 1.15rem/1.3 var(--serif); color: var(--ink); }

@media (hover: hover) {
  .rv .escolha .amb:hover { background: var(--secondary); }
  .rv .escolha .amb:hover::before { transform: scale(1.06); border-color: rgba(156, 125, 83, .4); }
  .rv .escolha .amb:hover .ir { background: #3A3227; }
  .rv .escolha .amb:hover .ir span { transform: translateX(6px); }
}
@media (prefers-reduced-motion: no-preference) {
  .escolha-pg .entra { animation: entra .7s var(--ease) both; }
  .escolha-pg .entra.d1 { animation-delay: .08s; } .escolha-pg .entra.d2 { animation-delay: .16s; }
  @keyframes entra { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
}
@media (prefers-reduced-motion: reduce) { .rv .escolha .amb::before, .amb .ir span { transition: none; } }
@media (max-width: 820px) {
  .escolha-pg main { padding: 44px 20px 48px; }
  .escolha { grid-template-columns: minmax(0, 1fr); margin-top: 40px; }
  .rv .escolha .amb { padding: 32px 24px 0; }
  .rv .escolha .amb + .amb { border-left: 0; border-top: 1px solid var(--line); }
  .amb .ir { margin-left: -24px; margin-right: -24px; padding: 20px 24px; }
}
</style>
</head>
<body class="rv escolha-pg">
<main>
  <header class="entra">
    <p class="olho">Escolha a plataforma</p>
    <h1>Olá<span id="ola"></span>. Por qual caminho você quer <em>seguir</em>?</h1>
    <p class="sub">Você pode trocar de plataforma a qualquer momento pelo rodapé do menu.</p>
  </header>
  <div class="escolha entra d1">
    <button type="button" class="amb prod" data-dest="/">
      <span class="publico">Empresas privadas</span>
      <span class="nome"><img src="/assets/reversa-r.png" alt="" width="44" height="44"><span class="h2">Reversa <em>Tax</em></span></span>
      <p>Diagnóstico tributário e previdenciário de empresas, com Lei do Bem, CRM, contratos e comissões.</p>
      <ul><li>Créditos de PIS, COFINS, IRPJ, CSLL, IPI e INSS</li><li>Teses, clientes e acompanhamento da execução</li></ul>
      <span class="ir">Entrar no Reversa Tax <span aria-hidden="true">→</span></span>
    </button>
    <button type="button" class="amb prod" data-dest="/gov.html">
      <span class="publico">Setor público</span>
      <span class="nome"><img src="/assets/reversa-r.png" alt="" width="44" height="44"><span class="h2">Reversa <em>Gov</em></span></span>
      <p>Diagnóstico de prefeituras, estados e União, quando aplicável: recuperação previdenciária, IRRF e arrecadação própria.</p>
      <ul><li>Fluxo de caixa projetado para o ente público</li><li>Relatórios técnico e comercial por município</li></ul>
      <span class="ir">Entrar no Reversa Gov <span aria-hidden="true">→</span></span>
    </button>
  </div>
  <footer class="assinatura entra d2">
    <img src="/assets/argus-prime-logo.png" alt="Argus Prime" width="80" height="53">
    <p><strong>Reversa é uma solução da Argus Prime</strong>Engenharia financeira e tributária</p>
  </footer>
</main>
<script src="/shell.js"></script>
<script>
  document.querySelectorAll('[data-dest]').forEach(function (b) {
    b.addEventListener('click', function () { RV.definirAmbiente('prod'); location.href = b.dataset.dest; });
  });
  RV.eu.then(function (eu) { var n = eu && eu.user && eu.user.name; if (n) document.getElementById('ola').textContent = ', ' + n.split(' ')[0]; });
</script>
</body>
</html>

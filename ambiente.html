<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escolha o caminho · Reversa</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Open+Sans:wght@700&display=swap">
<link rel="stylesheet" href="/shell.css">
<style>
  .escolha { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 760px) { .escolha { grid-template-columns: 1fr; } }
  .rv .escolha .amb { display: grid; gap: 14px; align-content: start; text-align: left; padding: 28px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--navy); cursor: pointer; font: inherit; font-weight: 500; width: 100%; }
  .rv .escolha .amb:hover { border-color: var(--teal); box-shadow: 0 8px 24px rgba(14,34,57,.08); filter: none; }
  .amb .tag { justify-self: start; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
  .amb.prod .tag { background: #DDF2EE; color: #16705F; } .amb.demo .tag { background: #F6E8D3; color: #7A4B0E; }
  .amb h2 { font-size: 26px; margin: 0; } .amb p { margin: 0; color: var(--muted); font-weight: 500; line-height: 1.5; }
  .amb ul { margin: 0; padding-left: 18px; color: var(--muted); font-weight: 500; line-height: 1.7; }
  .amb .ir { justify-self: start; margin-top: 6px; background: var(--teal); color: #fff; border-radius: 8px; padding: 10px 18px; font-weight: 700; }
  .amb.demo .ir { background: var(--navy); }
</style>
</head>
<body class="rv">
<main>
  <div class="cab"><div><h1>Olá<span id="ola"></span>. Por qual caminho você quer <em>seguir</em>?</h1>
    <p class="sub">Você pode trocar de caminho a qualquer momento pelo botão no rodapé do menu.</p></div></div>
  <div class="escolha">
    <button type="button" class="amb prod" data-dest="/">
      <span class="tag">Empresas privadas</span>
      <h2>Reversa Tax</h2>
      <p>Diagnóstico tributário e previdenciário de empresas, Lei do Bem, CRM, contratos e comissões.</p>
      <ul><li>Créditos de PIS, COFINS, IRPJ, CSLL, IPI e INSS</li><li>Teses, clientes e acompanhamento da execução</li></ul>
      <span class="ir">Seguir pelo Reversa Tax</span>
    </button>
    <button type="button" class="amb prod" data-dest="/gov.html">
      <span class="tag">Setor público</span>
      <h2>Reversa Gov</h2>
      <p>Diagnóstico de prefeituras, estados e União, quando aplicável: recuperação previdenciária, IRRF e arrecadação própria.</p>
      <ul><li>Fluxo de caixa projetado para o ente público</li><li>Relatórios técnico e comercial por município</li></ul>
      <span class="ir">Seguir pelo Reversa Gov</span>
    </button>
  </div>
  <p style="margin-top:28px;display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:500"><img src="/assets/argus-prime-monograma.png" alt="Argus Prime" style="height:28px;width:auto">Reversa é uma solução <strong style="margin-left:-6px">Argus Prime</strong></p>
</main>
<script src="/shell.js"></script>
<script>
  document.querySelectorAll('[data-dest]').forEach(function (b) {
    b.addEventListener('click', function () { RV.definirAmbiente('prod'); location.href = b.dataset.dest; });
  });
  RV.eu.then(function (eu) { var n = eu && eu.user && eu.user.name; if (n) document.getElementById('ola').textContent = ', ' + n.split(' ')[0]; });
</script>
</body>
</html>
